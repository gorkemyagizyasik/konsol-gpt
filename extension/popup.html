<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Konsol-GPT Cookie Sync</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .header-icon {
      font-size: 24px;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .status-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #6b7280;
    }

    .status-dot.success { background-color: var(--success); }
    .status-dot.error { background-color: var(--danger); }

    .status-text {
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 4px;
      word-break: break-word;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      background-color: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 12px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    .btn {
      width: 100%;
      padding: 10px;
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🔄</span>
    <span class="header-title">Konsol-GPT Sync</span>
  </div>

  <div class="card">
    <div class="status-container">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusTitle">Durum Kontrol Ediliyor...</span>
    </div>
    <div id="statusText" class="status-text">-</div>
  </div>

  <div class="form-group">
    <label for="serverUrl">Konsol-GPT Sunucu Adresi</label>
    <input type="text" id="serverUrl" value="http://localhost:8023">
  </div>

  <button id="syncBtn" class="btn">Çerezleri Şimdi Senkronize Et</button>

  <script src="popup.js"></script>
</body>
</html>
